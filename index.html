<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mobil Online Sidrap Pinrang Parepare</title>
    <!-- Memuat Tailwind CSS untuk Tampilan -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Memuat Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <!-- Memuat Ikon (FontAwesome) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: white; min-height: 100vh; box-shadow: 0 0 15px rgba(0,0,0,0.1); position: relative; padding-bottom: 120px;}
        /* Menghilangkan scrollbar untuk tampilan lebih bersih */
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- HEADER APLIKASI -->
        <div class="bg-red-600 text-white p-5 rounded-b-3xl shadow-lg">
            <div class="flex justify-between items-center mb-2">
                <div>
                    <h1 class="font-bold text-2xl tracking-tight">Mobil Online</h1>
                    <p class="text-xs font-light opacity-90">Sidrap - Pinrang - Parepare</p>
                </div>
                <div class="text-3xl bg-white text-red-600 w-12 h-12 rounded-full flex items-center justify-center shadow-md">
                    <i class="fas fa-car-side"></i>
                </div>
            </div>
        </div>

        <!-- AREA FORMULIR PESANAN -->
        <div class="p-5 mt-2">
            <h2 class="font-bold text-gray-800 mb-4 text-lg">Mau pergi ke mana hari ini?</h2>
            
            <div class="bg-white p-5 rounded-2xl shadow-[0_4px_20px_rgba(0,0,0,0.05)] border border-gray-100 relative mb-5">
                <!-- Garis putus-putus antara titik jemput dan tujuan -->
                <div class="absolute left-7 top-10 bottom-10 w-0.5 bg-gray-200 border-dashed border-l-2 z-0"></div>
                
                <!-- KOLOM TITIK JEMPUT -->
                <div class="flex items-start mb-6 relative z-20">
                    <div class="w-5 h-5 rounded-full bg-blue-100 flex items-center justify-center mr-3 border-2 border-blue-500 mt-1 shadow-sm">
                        <div class="w-2 h-2 bg-blue-500 rounded-full"></div>
                    </div>
                    <div class="flex-1 relative">
                        <label class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Lokasi Penjemputan</label>
                        <div class="relative">
                            <input type="text" id="inputJemput" class="w-full text-sm text-gray-800 border-b-2 border-gray-200 focus:border-red-500 outline-none py-2 pr-8 bg-transparent font-medium transition-colors" placeholder="Ketik kecamatan atau nama tempat..." oninput="cariLokasi('jemput')" autocomplete="off">
                            <!-- Tombol GPS untuk Lokasi Saat Ini -->
                            <button onclick="dapatkanLokasiSaatIni()" class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-400 hover:text-blue-500 transition-colors p-1" title="Gunakan Lokasi Saat Ini">
                                <i class="fas fa-crosshairs text-lg"></i>
                            </button>
                        </div>
                        <!-- Dropdown Sugesti Peta -->
                        <ul id="dropdownJemput" class="absolute w-full bg-white border border-gray-200 rounded-lg mt-1 shadow-xl z-50 max-h-56 overflow-y-auto hidden"></ul>
                    </div>
                </div>

                <!-- KOLOM TITIK TUJUAN -->
                <div class="flex items-start relative z-10">
                    <div class="w-5 h-5 rounded-full bg-red-100 flex items-center justify-center mr-3 border-2 border-red-500 mt-1 shadow-sm">
                        <i class="fas fa-map-marker-alt text-red-500 text-[10px]"></i>
                    </div>
                    <div class="flex-1 relative">
                        <label class="text-[11px] text-gray-400 font-bold uppercase tracking-wider">Lokasi Tujuan</label>
                        <input type="text" id="inputTujuan" class="w-full text-sm text-gray-800 border-b-2 border-gray-200 focus:border-red-500 outline-none py-2 bg-transparent font-medium transition-colors" placeholder="Ketik tujuan anda..." oninput="cariLokasi('tujuan')" autocomplete="off">
                        <!-- Dropdown Sugesti Peta -->
                        <ul id="dropdownTujuan" class="absolute w-full bg-white border border-gray-200 rounded-lg mt-1 shadow-xl z-50 max-h-56 overflow-y-auto hidden"></ul>
                    </div>
                </div>
            </div>

            <!-- AREA INFORMASI JARAK & STATUS PETA -->
            <div class="bg-blue-50/50 p-4 rounded-xl mb-5 border border-blue-100 flex items-center justify-between">
                <div>
                    <p class="text-xs text-blue-800 font-semibold mb-1"><i class="fas fa-route mr-1"></i> Jarak Perjalanan</p>
                    <p id="statusPeta" class="text-[10px] text-gray-500"><i class="fas fa-info-circle"></i> Menunggu lokasi dipilih...</p>
                </div>
                <div class="text-right flex items-baseline gap-1">
                    <span id="tampilanJarak" class="text-2xl font-black text-gray-800 tracking-tighter">0</span>
                    <span class="text-xs font-bold text-gray-500">KM</span>
                </div>
            </div>

            <!-- AREA RINCIAN TARIF -->
            <div class="bg-gray-50 p-5 rounded-2xl mb-4 border border-gray-200 shadow-inner">
                <div class="mb-3">
                    <span class="text-green-700 text-xs font-bold block text-center bg-green-100 p-2 rounded-lg border border-green-200 shadow-sm">
                        <i class="fas fa-gift mr-1 text-green-600"></i> Gratis penjemputan maksimal 7 kilometer!
                    </span>
                </div>
                <div class="flex justify-between items-center border-t border-gray-200 pt-3 mt-1">
                    <span class="text-gray-500 font-bold text-sm uppercase tracking-wider">Total Tarif</span>
                    <span class="text-3xl font-black text-red-600 tracking-tighter" id="tampilanTarif">Rp 0</span>
                </div>
            </div>
        </div>

        <!-- AREA TOMBOL PESAN (MENEMPEL DI BAWAH) -->
        <div class="fixed bottom-0 w-full max-w-[480px] bg-white p-4 border-t border-gray-200 shadow-[0_-10px_20px_rgba(0,0,0,0.05)] z-20 rounded-t-2xl">
            <div class="flex flex-col gap-3">
                <button onclick="kirimKeWhatsApp('pesan')" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-4 rounded-xl text-lg shadow-lg shadow-green-500/30 flex justify-center items-center gap-2 transition-all active:scale-[0.98]">
                    <i class="fab fa-whatsapp text-2xl"></i> PESAN SEKARANG
                </button>
                <button onclick="kirimKeWhatsApp('nego')" class="w-full bg-blue-50 hover:bg-blue-100 text-blue-700 font-bold py-2.5 px-4 rounded-xl text-sm border border-blue-200 flex justify-center items-center gap-2 transition-all active:scale-[0.98]">
                    <i class="fas fa-comments text-lg"></i> Nego Harga / Konsultasi
                </button>
            </div>
        </div>
    </div>

    <!-- LOGIKA JAVASCRIPT APLIKASI -->
    <script>
        // =========================================================
        // PENGATURAN UTAMA (ADMIN SILAKAN UBAH BAGIAN INI JIKA PERLU)
        // =========================================================
        
        // 1. MASUKKAN NOMOR WHATSAPP PERCOBAAN / ADMIN ANDA DI SINI
        // Format: Gunakan 62 sebagai pengganti 0. Jangan gunakan tanda + atau spasi.
        // Contoh: Jika nomor Anda 08123456789, tulis 628123456789
        const NOMOR_WA_ADMIN = "6285122451359"; // <--- UBAH NOMOR INI SAAT DI GITHUB
        
        // 2. PENGATURAN HARGA
        const TARIF_PER_KM = 5500;
        
        // =========================================================
        // VARIABEL SISTEM (JANGAN DIUBAH)
        // =========================================================
        let latJemput = null, lonJemput = null;
        let latTujuan = null, lonTujuan = null;
        let jarakTotalKM = 0;
        let tarifTotalRp = 0;
        let timeoutPencarian;

        // Fungsi mengubah angka menjadi format Rupiah
        function formatRupiah(angka) {
            return "Rp " + angka.toLocaleString('id-ID');
        }

        // Fungsi mencari alamat dari server peta gratis (Nominatim OpenStreetMap)
        async function cariLokasi(tipe) {
            clearTimeout(timeoutPencarian);
            const inputId = tipe === 'jemput' ? 'inputJemput' : 'inputTujuan';
            const dropdownId = tipe === 'jemput' ? 'dropdownJemput' : 'dropdownTujuan';
            const query = document.getElementById(inputId).value;

            if (query.length < 3) {
                document.getElementById(dropdownId).classList.add('hidden');
                return;
            }

            const dropdown = document.getElementById(dropdownId);
            dropdown.innerHTML = '<li class="p-3 text-xs text-gray-500 italic flex items-center gap-2"><i class="fas fa-circle-notch fa-spin text-red-500"></i> Sedang mencari...</li>';
            dropdown.classList.remove('hidden');

            timeoutPencarian = setTimeout(async () => {
                try {
                    // Batasi pencarian otomatis fokus ke Sulawesi Selatan
                    const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ', Sulawesi Selatan')}&limit=5`;
                    const response = await fetch(url);
                    const data = await response.json();
                    
                    dropdown.innerHTML = '';
                    
                    if (data.length > 0) {
                        data.forEach(place => {
                            const namaSingkat = place.display_name.split(',').slice(0, 3).join(', ');
                            const li = document.createElement('li');
                            li.className = 'p-3 border-b border-gray-100 text-[13px] text-gray-700 hover:bg-red-50 cursor-pointer font-medium flex items-start gap-2 transition-colors';
                            li.innerHTML = `<i class="fas fa-map-marker-alt text-red-400 mt-0.5"></i> <span>${place.display_name}</span>`;
                            
                            // Event saat alamat diklik
                            li.onclick = () => pilihLokasi(tipe, namaSingkat, place.lat, place.lon);
                            dropdown.appendChild(li);
                        });
                    } else {
                        dropdown.innerHTML = '<li class="p-3 text-xs text-red-500 italic">Lokasi tidak ditemukan, coba ketik nama kecamatan atau desa.</li>';
                    }
                } catch (e) {
                    dropdown.innerHTML = '<li class="p-3 text-xs text-red-500 italic">Gagal menyambung ke satelit. Periksa internet Anda.</li>';
                }
            }, 800); // Jeda pencarian agar tidak memberatkan server
        }

        // Fungsi saat pengguna mengklik salah satu alamat dari daftar saran
        function pilihLokasi(tipe, nama, lat, lon) {
            const inputId = tipe === 'jemput' ? 'inputJemput' : 'inputTujuan';
            const dropdownId = tipe === 'jemput' ? 'dropdownJemput' : 'dropdownTujuan';
            
            document.getElementById(inputId).value = nama;
            document.getElementById(dropdownId).classList.add('hidden');
            
            if (tipe === 'jemput') {
                latJemput = lat; lonJemput = lon;
            } else {
                latTujuan = lat; lonTujuan = lon;
            }

            // Jika jemput dan tujuan sudah terisi, hitung jarak!
            hitungRuteAsli();
        }

        // Fungsi mengukur jarak jalan raya (OSRM)
        async function hitungRuteAsli() {
            if (!latJemput || !latTujuan) return; 

            document.getElementById('statusPeta').innerHTML = '<i class="fas fa-circle-notch fa-spin text-blue-500"></i> Mengukur jarak jalan raya...';
            document.getElementById('tampilanJarak').innerText = "...";

            try {
                // Memanggil server perhitungan rute gratis
                const url = `https://router.project-osrm.org/route/v1/driving/${lonJemput},${latJemput};${lonTujuan},${latTujuan}?overview=false`;
                const response = await fetch(url);
                const data = await response.json();

                if (data.code === 'Ok') {
                    const jarakMeter = data.routes[0].distance;
                    let jarakKM = parseFloat((jarakMeter / 1000).toFixed(1));
                    
                    if (jarakKM < 1) jarakKM = 1.0; // Minimal jarak adalah 1 KM

                    jarakTotalKM = jarakKM;
                    document.getElementById('tampilanJarak').innerText = jarakKM;
                    document.getElementById('statusPeta').innerHTML = '<i class="fas fa-check-circle text-green-600"></i> Jarak berhasil dihitung akurat';
                    
                    hitungTarif(); 
                }
            } catch (e) {
                document.getElementById('statusPeta').innerHTML = '<i class="fas fa-exclamation-triangle text-red-500"></i> Gagal menghitung jarak rute.';
                document.getElementById('tampilanJarak').innerText = "0";
            }
        }

        // Fungsi kalkulasi harga final
        function hitungTarif() {
            tarifTotalRp = jarakTotalKM * TARIF_PER_KM;
            document.getElementById('tampilanTarif').innerText = formatRupiah(tarifTotalRp);
        }

        // Fungsi membuka aplikasi WhatsApp dengan pesan otomatis
        function kirimKeWhatsApp(jenisPesanan) {
            let jemput = document.getElementById('inputJemput').value.trim();
            let tujuan = document.getElementById('inputTujuan').value.trim();

            // Validasi: Pastikan lokasi tidak kosong
            if (!jemput || !tujuan) {
                alert("Mohon isi lokasi penjemputan dan tujuan terlebih dahulu!");
                return;
            }

            let teksWA = "";

            if (jenisPesanan === 'pesan') {
                teksWA = `Halo Admin Mobil Online SPP, saya ingin pesan mobil.

📍 *Jemput:* ${jemput}
🏁 *Tujuan:* ${tujuan}

🛣 *Jarak Asli:* ${jarakTotalKM} KM
💰 *Tarif (Rp5.500/km):* *${formatRupiah(tarifTotalRp)}*

Mohon dicarikan driver terdekat. Terima kasih.`;
            } else if (jenisPesanan === 'nego') {
                teksWA = `Halo Admin Mobil Online SPP, saya ingin konsultasi atau nego perjalanan.

📍 *Jemput:* ${jemput}
🏁 *Tujuan:* ${tujuan}
🛣 *Jarak Asli:* ${jarakTotalKM} KM
💰 *Estimasi Sistem:* *${formatRupiah(tarifTotalRp)}*

(Tulis pertanyaan atau nego harga Anda di sini...)`;
            }

            // Membuka link WhatsApp
            const urlWA = `https://wa.me/${NOMOR_WA_ADMIN}?text=${encodeURIComponent(teksWA)}`;
            window.open(urlWA, '_blank');
        }

        // =========================================================
        // FITUR BARU: MENDAPATKAN LOKASI GPS SAAT INI
        // =========================================================
        function dapatkanLokasiSaatIni() {
            const inputJemput = document.getElementById('inputJemput');
            
            // Cek apakah browser mendukung fitur GPS
            if (navigator.geolocation) {
                inputJemput.value = "Mencari lokasi GPS...";
                document.getElementById('statusPeta').innerHTML = '<i class="fas fa-satellite fa-spin text-blue-500"></i> Menghubungkan ke satelit GPS...';
                
                // Minta lokasi
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        // Dapat koordinatnya!
                        latJemput = position.coords.latitude;
                        lonJemput = position.coords.longitude;
                        
                        // Ubah koordinat menjadi teks alamat (Reverse Geocoding)
                        try {
                            const url = `https://nominatim.openstreetmap.org/reverse?format=json&lat=${latJemput}&lon=${lonJemput}`;
                            const response = await fetch(url);
                            const data = await response.json();
                            
                            if (data && data.display_name) {
                                // Ambil 3 bagian pertama dari alamat agar tidak terlalu panjang
                                const namaSingkat = data.display_name.split(',').slice(0, 3).join(', ');
                                inputJemput.value = namaSingkat + " (Lokasi Saat Ini)";
                                document.getElementById('statusPeta').innerHTML = '<i class="fas fa-check-circle text-green-600"></i> Lokasi GPS ditemukan';
                                
                                // Jika tujuan sudah diisi sebelumnya, langsung hitung tarifnya
                                hitungRuteAsli();
                            } else {
                                inputJemput.value = "Titik GPS Ditemukan";
                                hitungRuteAsli();
                            }
                        } catch (e) {
                            inputJemput.value = "Gagal menerjemahkan nama jalan";
                        }
                    },
                    (error) => {
                        alert("Gagal mendapatkan lokasi. Pastikan GPS (Lokasi) HP Anda aktif dan Anda memberikan izin pada browser.");
                        inputJemput.value = "";
                        document.getElementById('statusPeta').innerHTML = '<i class="fas fa-info-circle text-gray-500"></i> Menunggu lokasi dipilih...';
                    },
                    { enableHighAccuracy: true } // Minta akurasi tertinggi
                );
            } else {
                alert("Browser HP Anda tidak mendukung fitur lokasi.");
            }
        }

        // Menutup dropdown jika user mengklik area kosong di layar
        document.addEventListener('click', function(event) {
            const dropdownJ = document.getElementById('dropdownJemput');
            const dropdownT = document.getElementById('dropdownTujuan');
            const inputJ = document.getElementById('inputJemput');
            const inputT = document.getElementById('inputTujuan');

            if (event.target !== inputJ && !dropdownJ.contains(event.target)) {
                dropdownJ.classList.add('hidden');
            }
            if (event.target !== inputT && !dropdownT.contains(event.target)) {
                dropdownT.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
